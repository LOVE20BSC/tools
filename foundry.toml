[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
auto_detect_remappings = false

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 15
fail_on_revert = false

[lint]
severity = ["high", "med", "low"]
ignore = ["test/**/*.sol"]
# missing-zero-check: 两个合约都不在这个 lint 的作用面上——BatchTransfer 没有构造函数，因此没有
# 「构造期不校验零值」的位置；UniswapV2Zap 有构造函数，且它确实校验了（ZeroRouter / ZeroFactory /
# ZeroWrappedNativeToken）。部署期的静态校验按 dev-standards §5.7 / §6.3 归部署脚本。这一条因此
# 不需要写进 exclude_lints。
#
# exclude_lints 是仓级配置，同时作用于两个合约，所以每条理由必须覆盖两者。下面按实测的告警位置给：
# BatchTransfer.sol:25/126/155 与 UniswapV2Zap.sol:70/112/423 是 calls-loop 与 reentrancy-events
# 的实际命中点（把 exclude_lints 清空后跑 `forge lint` 可复现：calls-loop 3 条、reentrancy-events
# 4 条、unused-return 1 条）。
# - calls-loop（仅 BatchTransfer）：batchTransferNative 逐个 call 付款、_erc20BalanceOf 逐个
#   balanceOf、_safeTransferFrom 逐个 transferFrom。对一批外部地址循环调用就是「批量工具」的定义
#   行为；每次都必须拿到最新外部状态，无法合并成一次调用。UniswapV2Zap 没有循环，不受这条影响。
# - reentrancy-events（两个合约都命中）：这条 lint 问的是「事件发出前有没有经过外部调用，以及重入
#   能否借此伪造或重排链下依赖的日志」。两个合约的答案都是否，但理由不同：
#     · BatchTransfer 无状态、无 owner、不托管资产，事件前没有任何写操作，重入无法伪造可信状态；
#       事件只由 msg.sender 与已验证入参构成，重入最多把这笔如实发生的事实重复记录一次。
#     · UniswapV2Zap 有重入锁（OZ ReentrancyGuard 的 ERC-7201 命名空间槽，见
#       `forge inspect UniswapV2Zap storage`——标准布局里看不到它），两个入口都是 nonReentrant，
#       且事件在函数末尾一次性发出、载荷来自本函数算出的结果，重入无法插入第二个 zap。
# - unused-return（仅 BatchTransfer）：批量入口有意忽略部分 tuple 返回值（只判 call 的 success、
#   余额查询只看 data 长度），被忽略的分量在同一函数内单独校验。本类当前实际告警数 0，保留它是
#   为防止后续改动引入忽略返回值时静默通过。
#
# arbitrary-send-eth 与 return-bomb 不在全局列表里：它们分别在 src/BatchTransfer.sol 与
# src/UniswapV2Zap.sol 的原生币转发处用 `forge-lint: disable-next-line(...)` 精确抑制。
exclude_lints = ["calls-loop", "reentrancy-events", "unused-return"]

# 若要把 calls-loop 收紧为行内抑制（当前未执行，待评审决定）：
# 1. 从 exclude_lints 里删掉 "calls-loop"（保留另外两项）；
# 2. 在下列三处的语句前各加一行 `// forge-lint: disable-next-item(calls-loop)`：
#    - batchTransferNative 里的 `(bool success, bytes memory data) =` 之前
#      （注意：该行上方已有 arbitrary-send-eth / return-bomb 的 disable-next-line，两行可共存）；
#    - _erc20BalanceOf 里的 `(bool success, bytes memory data) =` 之前；
#    - _safeTransferFrom 里的 `(bool success, bytes memory data) =` 之前。
# 3. 用 `forge lint` 验证零告警。实测（Foundry 1.8.1）此方案可行：calls-loop 必须用
#    disable-next-item 挂在多行赋值语句（`= token.call(...)`）之前才生效，挂在被调用的那一行
#    上方（disable-next-line 或 item）都不生效；这是该 lint 按 AST 节点定位抑制点导致的。
