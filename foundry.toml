[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
auto_detect_remappings = false

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 15
fail_on_revert = false

[lint]
severity = ["high", "med", "low"]
ignore = ["test/**/*.sol"]
exclude_lints = ["calls-loop", "reentrancy-events"]

# 本节只描述 BatchTransfer——本仓唯一的合约，也是唯一被 lint 的源码。
#
# severity：只拦截 high/med/low 三档，不把 info/gas 档的 note 当门禁。Foundry 1.8.1 的默认值恰好
# 也是这三档，这里显式写出是为了钉死门禁：默认值若在升级中放宽，note 会悄悄变成失败项。实测当前
# 源码在 info 档还有 11 条 note（low-level-calls / literal-instead-of-constant 等），它们不构成缺陷，
# 因此不进 severity 也不进 exclude_lints。
#
# ignore：test/ 整体不参与 lint。断言用的 mock 故意做真实合约不该做的事——持有原生币却不转出
# （locked-ether）、无事件改 allowance（missing-events-access-control）、把 uint256 截成小类型
# （unsafe-typecast）、不检查 address 参数零值（missing-zero-check）、忽略调用的返回值
# （unused-return，29 条）。这些是测试夹具的构造需要，不是可整改项；实测清空 ignore 后
# `forge lint` 报 43 条告警，全部落在 test/BatchTransfer.t.sol 与 test/mocks/BatchTransferMocks.sol。
#
# exclude_lints：只有两项，理由逐条对应源码位置（清空 exclude_lints 并保留 ignore 后
# `forge lint` 可复现同样的 5 条：calls-loop 3 条、reentrancy-events 2 条）。
#
# - calls-loop（3 条：src/BatchTransfer.sol:26 / :133 / :173）
#   batchTransferNative 逐个 call 付款、_erc20BalanceOf 逐个 balanceOf、_safeTransferFrom 逐个
#   transferFrom。「对一批外部地址循环调用」就是批量工具的定义行为，不是可合并成一次调用的写法：
#   每个收款方与每个被查询账户都必须单独取到最新外部状态，合并会改变语义。三条命中点都在循环体内，
#   gas 上限由调用方的 gasLimit 逐笔约束，批量大小由调用方付 gas 决定。
#   —— 这条只有 BatchTransfer 会命中（本仓已无第二个合约）。
#
# - reentrancy-events（2 条：src/BatchTransfer.sol:34 / :66）
#   这条 lint 问的是「事件发出前经过外部调用，重入能否借此伪造或重排链下依赖的日志」。本合约的答案
#   是否：它无状态、无 owner、不托管资产，事件前没有任何写操作，重入无法伪造可信状态；两个事件都
#   在函数末尾一次性发出，载荷只由 msg.sender 与已验证入参构成，重入最多把「这笔确实发生了」
#   如实重复记录一次，改不掉事实。不发事件反而更差：见 README「事件设计」一节。
#
# 不在 exclude_lints 里、改用行内 `forge-lint: disable-next-line` 精确抑制的三类（位置见 src/）：
#
# - arbitrary-send-eth（1 处，src/BatchTransfer.sol:25）与 return-bomb（2 处，:25 / :172）：
#   前者是原生币转发那一行——收款方本来就是调用方给的清单，限制目标等于废掉工具本身；后者是
#   有意保留完整返回数据（keccak256 才是可诊断的部分）。这两类挂在整个文件的全局列表里会连未来
#   新增的无关调用一起放过，因此逐行抑制。实测删掉这两行抑制后 `forge lint` 报 1 条
#   arbitrary-send-eth 与 2 条 return-bomb。
# - require-revert-in-loop（6 处，:29 / :110 / :114 / :136 / :176 / :181）：逐笔失败必须带上失败
#   元素的下标，构造错误要用到循环变量，不能提到循环外。实测删掉这 6 行抑制后报 6 条。
#
# missing-zero-check 不写进 exclude_lints：本合约没有构造函数，因此不存在「构造期不校验零值」
# 的位置；零地址入参另有运行期检查（ZeroRecipient / TokenNotContract）。部署期的静态校验按
# dev-standards §5.7 / §6.3 归部署脚本。
